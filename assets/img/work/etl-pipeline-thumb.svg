<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <defs>
    <radialGradient id="sweep" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2321"/>
      <stop offset="100%" stop-color="#12181a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="220" fill="url(#bg)"/>

  <!-- 레이더 스코프 -->
  <g transform="translate(150,110)">
    <circle r="85" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>
    <circle r="58" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>
    <circle r="30" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#34d399" stroke-opacity="0.18"/>
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#34d399" stroke-opacity="0.18"/>

    <path d="M0,0 L85,0 A85,85 0 0,0 60,-60 Z" fill="url(#sweep)"/>
    <line x1="0" y1="0" x2="85" y2="0" stroke="#a7f3d0" stroke-width="2"/>

    <circle cx="40" cy="-35" r="4" fill="#a7f3d0"/>
    <circle cx="-30" cy="40" r="3" fill="#a7f3d0" opacity="0.6"/>
    <circle cx="55" cy="30" r="3" fill="#a7f3d0" opacity="0.6"/>
  </g>

  <!-- 데이터 흐름 -->
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <line x1="260" y1="110" x2="520" y2="110"/>
  </g>
  <g fill="#34d399">
    <circle cx="290" cy="110" r="7"/>
    <circle cx="370" cy="110" r="7" opacity="0.85"/>
    <circle cx="450" cy="110" r="7" opacity="0.7"/>
    <circle cx="520" cy="110" r="9" opacity="0.95"/>
  </g>
  <path d="M505,100 L522,110 L505,120" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
