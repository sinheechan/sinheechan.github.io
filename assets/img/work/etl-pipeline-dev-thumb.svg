<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2321"/>
      <stop offset="100%" stop-color="#12181a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="220" fill="url(#bg)"/>

  <!-- 톱니바퀴: 개발/구축 -->
  <g transform="translate(150,110)">
    <g fill="#34d399">
      <g id="teeth">
        <rect x="-9" y="-70" width="18" height="22" rx="3"/>
      </g>
      <use href="#teeth" transform="rotate(45)"/>
      <use href="#teeth" transform="rotate(90)"/>
      <use href="#teeth" transform="rotate(135)"/>
      <use href="#teeth" transform="rotate(180)"/>
      <use href="#teeth" transform="rotate(225)"/>
      <use href="#teeth" transform="rotate(270)"/>
      <use href="#teeth" transform="rotate(315)"/>
    </g>
    <circle r="52" fill="none" stroke="#34d399" stroke-width="14"/>
    <circle r="52" fill="url(#bg)" opacity="0"/>
    <circle r="20" fill="#12181a"/>
    <circle r="20" fill="none" stroke="#a7f3d0" stroke-width="2"/>
  </g>

  <!-- 코드 브래킷 -->
  <g transform="translate(400,110)" fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-40,-45 L-70,0 L-40,45"/>
    <path d="M40,-45 L70,0 L40,45"/>
  </g>
  <line x1="10" y1="120" x2="-10" y2="-20" transform="translate(400,0)" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>

  <!-- 연결선 -->
  <line x1="230" y1="110" x2="330" y2="110" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 5"/>
</svg>
